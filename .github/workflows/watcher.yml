name: intraday-watcher
# Ping watcher mỗi 5 phút trong phiên VN (9:00–14:55 ICT = 2:00–7:55 UTC, T2–T6).
# GitHub scheduled cron có thể trễ vài phút dưới tải — đủ cho canh stop EOD+intraday.
on:
  schedule:
    - cron: "*/5 2-7 * * 1-5"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -m 40 "$BASE/api/cron/watcher?secret=$CRON_SECRET" || echo "watcher ping failed"
        env:
          BASE: https://vn-trader.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
