name: positions-report
# Báo cáo vị thế mỗi 30 phút trong phiên VN (9:07/9:37/… ICT).
on:
  schedule:
    - cron: "7,37 2-7 * * 1-5"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -m 40 "$BASE/api/cron/positions-report?secret=$CRON_SECRET" || echo "report ping failed"
        env:
          BASE: https://vn-trader.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
